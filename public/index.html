<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Networked Multiplayer Game</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #1a1a1a;
      font-family: Arial, sans-serif;
      color: #ffffff;
    }
    h1 {
      margin-bottom: 10px;
    }
    #info {
      margin-bottom: 20px;
      text-align: center;
    }
    #gameCanvas {
      border: 2px solid #333;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }
    .instruction {
      margin-top: 20px;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Networked Multiplayer Game</h1>
  <div id="info">
    <div>Players online: <span id="playerCount">0</span></div>
    <div>Your ID: <span id="playerId">Connecting...</span></div>
  </div>
  <div id="gameCanvas"></div>
  <div class="instruction">Use WASD or Arrow Keys to move</div>

  <script src="p5.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
